<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fafaf8">
<meta name="description" content="Liin Lab · 独立研究者。当前实验：AR Tattoo、VR Latte Art、Human-Sensing Interfaces。">
<title>Liin Lab</title>
<style>
:root{color-scheme:light;--paper:#fafaf8;--ink:#252525;--muted:#70706b;--line:#e0e0da}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}::selection{background:#252525;color:#fafaf8}main{max-width:824px;margin:0 auto;padding:112px 52px 32px}header{margin-bottom:114px}h1{font-size:56px;line-height:1.1;letter-spacing:-3px;font-weight:500;margin:0 0 24px}h1>span{color:#92928c}header p{font-size:14px;line-height:1.8;margin:0;font-weight:400}.english{display:block;color:var(--muted);font-size:12px;margin-top:3px;letter-spacing:.01em}.section-title{display:flex;align-items:baseline;gap:17px;padding-bottom:20px}.section-title h2{font-size:12px;letter-spacing:.05em;font-weight:400;margin:0}.section-title>span{font-size:11px;color:var(--muted)}.experiments{margin:0;padding:0;list-style:none;border-top:1px solid var(--line)}.experiments li{display:grid;grid-template-columns:55px 1fr;align-items:baseline;gap:10px;padding:27px 0;border-bottom:1px solid var(--line)}.number{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:10px;color:var(--muted)}h3{margin:0;font-size:23px;line-height:1.35;letter-spacing:-.6px;font-weight:400}footer{display:flex;justify-content:space-between;gap:20px;margin-top:126px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:10px;color:var(--muted)}@media(min-width:1500px){main{padding-top:140px}}@media(max-width:600px){main{padding:64px 26px 28px}header{margin-bottom:80px}h1{font-size:44px;letter-spacing:-2px}.experiments li{grid-template-columns:30px 1fr;gap:10px;padding:25px 0}h3{font-size:20px;letter-spacing:-.4px}footer{margin-top:90px;font-size:9px}}@media(max-width:360px){main{padding-left:20px;padding-right:20px}h3{font-size:18px}}

</style>
</head>
<body>
<main>
<header>
<h1>Liin Lab<span aria-hidden="true">.</span></h1>
<p>独立研究者<span class="english" lang="en">Independent researcher</span></p>
</header>
<section aria-labelledby="experiments-title">
<div class="section-title"><h2 id="experiments-title">当前实验</h2><span lang="en">Ongoing experiments</span></div>
<ol class="experiments">
<li><span class="number" aria-hidden="true">01</span><h3 lang="en">AR Tattoo</h3></li>
<li><span class="number" aria-hidden="true">02</span><h3 lang="en">VR Latte Art</h3></li>
<li><span class="number" aria-hidden="true">03</span><h3 lang="en">Human-Sensing Interfaces</h3></li>
</ol>
</section>
<footer><span>Liin Lab</span><span>liinlab.github.io</span></footer>
</main>
</body>
</html>
